name: Compiler V08.11 depuis le ZIP

on:
  push:
    paths:
      - "Programmation-Caen-Windows-source-V08.11.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: EXE portable Windows 64 bits
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Extraire la source V08.11
        shell: pwsh
        run: Expand-Archive -Path "Programmation-Caen-Windows-source-V08.11.zip" -DestinationPath "source" -Force

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Installer les dépendances
        working-directory: source
        run: npm ci

      - name: Vérifier et construire
        working-directory: source
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Mettre l'EXE à disposition
        uses: actions/upload-artifact@v4
        with:
          name: Programmation-Caen-V08.11-Windows
          path: |
            source/release/*.exe
            source/release/*-Mise-a-jour.zip
          if-no-files-found: error
          retention-days: 30
